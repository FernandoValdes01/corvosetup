interface:
  display_name: "teachme"
  short_description: "Instala una guía web local; no responde con resúmenes"
  default_prompt: "Usa $teachme para construir e instalar la guía navegable de este proyecto. Explica primero qué se nos pidió y cuál es el problema; después incluye en esa misma primera fase un marco teórico obligatorio y amplio en story.glossary. Define todos los conceptos previos relevantes, cómo funcionan o cuál es su idea, qué papel cumplen aquí y ejemplos concretos. Ordénalos desde los prerrequisitos hasta los conceptos avanzados; no impongas un límite arbitrario de términos y evita tanto huecos como relleno ajeno al proyecto. Conserva la estructura {term, explanation}. Enseña qué decisiones tomamos, cómo funcionan y por qué. Busca, abre e incorpora los gráficos y diagramas existentes que expliquen el recorrido; no los reemplaces por citas de código. Si faltan, decide qué crear, prefiriendo gráficos para ejemplos matemáticos y diagramas para infraestructura, DevOps y sistemas. Representa las dependencias entre carpetas cuando sean necesarias y explica qué exige sus ubicaciones. Cierra con lo que produce el código o la infraestructura, distinguiendo resultados observados y esperados. La enseñanza general nace del razonamiento, sin una sección de transferencia. Crea tutorial.json y deja ./teach funcionando."

policy:
  allow_implicit_invocation: true
